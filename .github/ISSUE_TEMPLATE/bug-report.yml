name: Bug report
description: Report a reproducible SoloTrace private-beta defect
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include audio, project bundles, filenames, API keys, or unredacted logs.
        Security problems belong in a private security advisory.
  - type: input
    id: version
    attributes:
      label: Version and build ID
      placeholder: "0.1.0 / 202607201530"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS and Mac
      placeholder: "macOS 14.7, Apple M2"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Import and projects
        - Offline preview
        - Experimental MVSep
        - Tab editing and versions
        - Playback and practice
        - Export and diagnostics
        - Installation and update
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic or non-identifying descriptions.
      placeholder: |
        1. Open …
        2. Choose …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Failure code or redacted diagnostics
      description: Attach only SoloTrace's redacted export after inspecting it.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed audio, project data, filenames, secrets, and personal information.
          required: true
