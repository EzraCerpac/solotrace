name: Release macOS beta

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching pyproject.toml, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-macos
  cancel-in-progress: false

jobs:
  release:
    name: sign, notarize, and publish
    runs-on: macos-14
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      NOTARY_PROFILE: solotrace-ci
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set release paths
        run: echo "KEYCHAIN_PATH=$RUNNER_TEMP/solotrace-signing.keychain-db" >> "$GITHUB_ENV"

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-python: true

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.15.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Validate release input and credentials
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPER_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -eu
          for value in \
            "$APPLE_CERTIFICATE_P12_BASE64" \
            "$APPLE_CERTIFICATE_PASSWORD" \
            "$APPLE_DEVELOPER_IDENTITY" \
            "$APPLE_NOTARY_KEY_BASE64" \
            "$APPLE_NOTARY_KEY_ID" \
            "$APPLE_NOTARY_ISSUER_ID"
          do
            test -n "$value"
          done
          version=$(uv run --frozen python -c \
            'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$RELEASE_TAG" = "v$version"
          git fetch --tags --force
          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Install locked dependencies
        run: |
          uv sync --locked --no-dev --group desktop
          pnpm install --frozen-lockfile

      - name: Import signing and notarization credentials
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -eu
          certificate_path="$RUNNER_TEMP/DeveloperID.p12"
          notary_key_path="$RUNNER_TEMP/AuthKey.p8"
          keychain_password=$(openssl rand -hex 24)
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate_path"
          printf '%s' "$APPLE_NOTARY_KEY_BASE64" | base64 --decode > "$notary_key_path"
          security create-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security import "$certificate_path" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --key "$notary_key_path" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --keychain "$KEYCHAIN_PATH"

      - name: Build signed and notarized DMG
        env:
          SOLOTRACE_CODESIGN_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
          SOLOTRACE_NOTARY_PROFILE: ${{ env.NOTARY_PROFILE }}
          SOLOTRACE_NOTARY_KEYCHAIN: ${{ env.KEYCHAIN_PATH }}
        run: ./scripts/release-macos.sh

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SoloTrace-${{ inputs.tag }}-macOS-arm64
          path: |
            dist/release/*.dmg
            dist/release/*.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/release/*.dmg \
            dist/release/*.sha256 \
            --target "$GITHUB_SHA" \
            --title "SoloTrace $RELEASE_TAG" \
            --generate-notes \
            --prerelease

      - name: Remove temporary keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" || true
