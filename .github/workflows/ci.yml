name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-python: true

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packaged web assets
        run: pnpm build

      - name: Install locked Python dependencies
        run: uv sync --locked --group dev

      - name: Lint Python
        run: uv run --frozen ruff check server tests

      - name: Test Python
        run: uv run --frozen pytest

      - name: Check and test web app
        run: |
          pnpm check:editor
          pnpm test:editor
          pnpm check:web
          pnpm test:web

      - name: Check and test hosted example studio
        run: |
          pnpm check:site
          pnpm test:site

      - name: Smoke installed wheel
        run: ./scripts/smoke-wheel.sh
