packages:
  - web
  - site
  - packages/*
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true
overrides:
  # Keep Next and Browserslist above the invalid-input process termination fix.
  baseline-browser-mapping: ^2.11.0
  brace-expansion: 5.0.12
  esbuild: 0.28.1
  js-yaml: 4.3.2
  minimatch@3.1.5: 10.2.5
  nanoid: 3.3.18
  postcss: 8.5.23
  sharp: 0.35.5
  # Keep Tailwind, PostCSS, and css-tree above the indexed source-map DoS fix.
  source-map-js: ^1.2.2
  undici: 7.29.1
  # Vinext pins 2.0.2; use its compatible image parser security patch release.
  vinext>image-size: 2.0.3
  ws: 8.21.0
patchedDependencies:
  image-size@2.0.3: patches/image-size@2.0.3.patch
