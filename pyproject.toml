[project]
name = "solotrace"
version = "0.1.0"
description = "Local-first synchronized guitar solo transcription and practice studio"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.139.2,<0.140",
  "httpx>=0.28.1,<0.29",
  "keyring>=25.6,<26",
  "librosa>=0.11.0,<0.12",
  "mido>=1.3.3,<2",
  "numpy>=2.0,<3",
  "platformdirs>=4.3,<5",
  "python-multipart>=0.0.20,<0.1",
  "scipy>=1.15,<2",
  "soundfile>=0.14.0,<0.15",
  "uvicorn[standard]>=0.40.0,<0.41",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1,<10",
  "pytest-cov>=7.1,<8",
  "ruff>=0.15.22,<0.16",
]
desktop = [
  "basic-pitch==0.4.0",
  "coremltools==9.0; sys_platform == 'darwin'",
  "pyinstaller>=6.21,<7; sys_platform == 'darwin'",
  "pywebview>=6.1,<7; sys_platform == 'darwin'",
  "setuptools==80.9.0",
]

[project.scripts]
solotrace = "solotrace.main:run"
solotrace-desktop = "solotrace.desktop:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server/solotrace"]

[tool.hatch.build.targets.wheel.force-include]
"web/dist" = "solotrace/static"

[tool.uv]
# SoloTrace ships Basic Pitch's CoreML model on macOS/Python 3.11. Its
# TensorFlow backends are unused and otherwise pollute the universal lock with
# vulnerable, non-shipped Keras and protobuf versions.
exclude-dependencies = ["tensorflow", "tensorflow-macos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
