[project]
name = "solotrace"
version = "0.1.0"
description = "Local-first synchronized guitar solo transcription and practice studio"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.128.0,<0.129",
  "librosa>=0.11.0,<0.12",
  "mido>=1.3.3,<2",
  "numpy>=2.0,<3",
  "platformdirs>=4.3,<5",
  "python-multipart>=0.0.20,<0.1",
  "scipy>=1.15,<2",
  "soundfile>=0.13.1,<0.14",
  "uvicorn[standard]>=0.40.0,<0.41",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1,<0.29",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<0.13",
]

[project.scripts]
solotrace = "solotrace.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server/solotrace"]

[tool.hatch.build.targets.wheel.force-include]
"web/dist" = "solotrace/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
